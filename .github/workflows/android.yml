name: GDWorld Android
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;25.2.9519653'
      - name: Test and build ARM64 APK
        run: bash gradlew :ZalithLauncher:testDebugUnitTest :ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GDWorld-Android-test
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.GDWORLD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/gdworld.jks"
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GDWORLD_KEYSTORE: ${{ runner.temp }}/gdworld.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash gradlew :ZalithLauncher:assembleRelease -Darch=arm64 --stacktrace
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release
          cp ZalithLauncher/build/outputs/apk/release/*.apk release/GDWorld-Android.apk
          cd release
          sha256sum GDWorld-Android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: GDWorld-Android-release
          path: release/*
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/gdworld.jks"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GDWorld-Android-release
          path: release
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "GDWorld Android $GITHUB_REF_NAME" --prerelease --generate-notes
